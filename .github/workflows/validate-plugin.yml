name: Validate DevFlow AI Plugin

on:
  push:
    branches: [main]
    paths:
      - "devflow-ai/**"
      - ".cursor-plugin/**"
      - ".github/workflows/validate-plugin.yml"
  pull_request:
    branches: [main]
    paths:
      - "devflow-ai/**"
      - ".cursor-plugin/**"
      - ".github/workflows/validate-plugin.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devflow-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate plugin structure
        run: node scripts/validate-plugin.mjs

      - name: Validate plugin.json schema basics
        run: node scripts/validate-manifest.mjs

      - name: Validate mcp.json variable placeholders
        run: node scripts/validate-mcp.mjs